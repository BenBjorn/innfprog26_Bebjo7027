<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat sheet variabler</title>
</head>
<body>
    <h1>Variabler i JavaScript</h1>
    <p>Hei, <span id="name"></span>!(<span id="age">?</span> år)</p>

    <script>
        //DEKLARERE VARIABLER
        /*
        * CONST: deklarerer en konstant verdi som ikke skal endres
        * LET: deklarerer en verdi som kan endres
        */
       const firstName = "Benjamin"
       console.log(firstName)
       const lastName = "Bjørnstad"
       //skriv ut firstName-verdi til  HTML-element med id name
       //Vi bruker ? slår altså sammen variabler og tekst for å skrive ut fornavn + etternavn
       document.getElementById("name").innerHTML = firstName + " " + lastName

       //DEKLARERER EN VARIABEL FOR ALDER
       const birthYear = 2005
       let age = 2026 - birthYear
       document.getElementById("age").innerHTML = age
    </script>
</body>
</html>
